baseURL: "https://devdocs.prestashop-project.org/"
languageCode: "en-us"
defaultContentLanguage: "en"
title: "PrestaShop Developer Documentation"

theme: "ps-docs-theme"
enableGitInfo: true
enableRobotsTXT: true
googleAnalytics: "GTM-P45KQNTD"

params:
  enableCustomGitInfo: true
  docsURL: "https://devdocs.prestashop-project.org/"
  editURL: "https://github.com/PrestaShop/docs/edit/"
  ghRepoURL: "https://github.com/PrestaShop/docs/"
  ghCommitURL: "https://github.com/PrestaShop/docs/commit/"
  ghApiCommitURL: "https://api.github.com/repos/prestashop/docs/commits"
  howToContributeURL: "/9/contribute/documentation/how"
  currentUpgradeGuideURL: "/9/basics/keeping-up-to-date/update"
  hookListURL: "/9/modules/concepts/hooks/list-of-hooks"
  description: "Learn how to extend, modify and test PrestaShop, create modules, themes, and more."
  author: "PrestaShop"
  showVisitedLinks: false
  disableInlineCopyToClipBoard: true
  projectUrls:
    gitHub: "https://github.com/PrestaShop/PrestaShop/"
    reportBug: "https://github.com/PrestaShop/PrestaShop/issues"
    slack: "https://www.prestashop-project.org/slack/readme/"
  coverImage: "images/social-cover-2024.jpg"
  logoTitle: "PrestaShop"
  privacy:
    googleAnalytics:
      defaultGtagStorageDenied: true
      waitForUpdate: 500
      anonymizeIP: true


  # Default documentation version
  versions:
    current: "9"

  docSearch:
    appId: "79DO4UR9Y5"
    apiKey: "352524fc37137a45610faa44bcc1a47c"
    indexName: "prestashop"

# Machine-readable outputs consumed by the MCP server (see mcp-server/README.md)
outputFormats:
  # Raw markdown source of every page, emitted next to its index.html
  # e.g. /9/basics/introduction/index.md
  markdown:
    mediaType: "text/markdown"
    baseName: "index"
    isPlainText: true
    permalinkable: false
    notAlternative: true
  # llms.txt convention: https://llmstxt.org/  -> /llms.txt
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    permalinkable: false
    notAlternative: true
  # Compact page catalogue for the MCP server -> /mcp-index.json
  mcpindex:
    mediaType: "application/json"
    baseName: "mcp-index"
    isPlainText: true
    permalinkable: false
    notAlternative: true

# For search functionality
outputs:
  home: ["HTML", "RSS", "JSON", "LLMS", "MCPINDEX"]
  section: ["HTML", "RSS", "MARKDOWN"]
  page: ["HTML", "MARKDOWN"]

markup:
  highlight:
    codeFences: true
    guessSyntax: true
    hl_Lines: ""
    lineNoStart: 1
    lineNos: false
    lineNumbersInTable: true
    noClasses: false
    style: github
    tabWidth: 4
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
  tableOfContents:
    endLevel: 4
    ordered: false
    startLevel: 1

ignoreFiles:
  - /README.md$
  - /LICENSE$
  - /CLAUDE\.md$
  - /CONTEXT\.md$
  - \.gitignore$
  - \.github$
  - \.claude$

security:
  funcs:
    getenv:
      - ^HUGO_
      - ^DEVDOCS_
