name: Deploy MCP server

# The MCP server is a small Cloudflare Worker that reads the static artifacts
# published to GitHub Pages by build.yml. It only needs redeploying when its own
# source changes — new documentation is picked up automatically at runtime.
on:
  push:
    branches:
      - main
    paths:
      - 'mcp-server/**'
      - '.github/workflows/deploy-mcp.yml'
  pull_request:
    paths:
      - 'mcp-server/**'
      - '.github/workflows/deploy-mcp.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: mcp-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy to Cloudflare Workers
        if: ${{ github.event_name != 'pull_request' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mcp-server
